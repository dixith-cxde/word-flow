repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0 # verified via ls-remote 2026-10-01
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: detect-private-key # secret scan: blocks private key commits
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9 # mirrors installed ruff 0.16.9, verified via ls-remote
    hooks:
      - id: ruff-check
      - id: ruff-format
