[project]
name = "offline-dictation"
version = "0.1.0"
description = "Offline hold-to-talk voice dictation for Linux Wayland"
requires-python = ">=3.12"
dependencies = [
    "sherpa-onnx==1.13.8", # ASR runtime (Apache-2.0) + Parakeet transducer API
    "sounddevice==0.5.6", # PortAudio mic capture, Linux/macOS/Windows (MIT)
    "numpy==2.5.3", # audio buffers
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1", # unit tests
    "ruff==0.16.9", # lint + format
    "pre-commit==4.6.2", # hooks: whitespace, private-key scan, ruff
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
